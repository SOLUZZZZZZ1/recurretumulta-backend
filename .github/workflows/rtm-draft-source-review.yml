name: RTM Draft Source Review

on:
  push:
    branches: [rtm-ai-security-hardening-draft-save-2026-10-08]
    paths: [.github/workflows/rtm-draft-source-review.yml]

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read exact backend source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ec625e2dbdbe7cb6e181a3c686eb93848ebfe21d
          path: backend-source
          persist-credentials: false
      - name: Read exact frontend source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SOLUZZZZZZ1/recurretumulta-frontendweb3-8-26
          ref: c2b9b5b0fc0375ca8434582a889a0ccba58f5696
          path: frontend-source
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-snapshots
          test "$(git -C backend-source rev-parse HEAD)" = ec625e2dbdbe7cb6e181a3c686eb93848ebfe21d
          test "$(git -C frontend-source rev-parse HEAD)" = c2b9b5b0fc0375ca8434582a889a0ccba58f5696
          git -C backend-source archive --format=tar HEAD > source-snapshots/backend.tar
          git -C frontend-source archive --format=tar HEAD > source-snapshots/frontend.tar
          (cd source-snapshots && sha256sum backend.tar frontend.tar > SHA256SUMS)
      - name: Retain source for this review only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rtm-draft-source-review
          path: source-snapshots/
          retention-days: 1
          if-no-files-found: error
