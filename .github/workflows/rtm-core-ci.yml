name: RTM CORE CI

on:
  push:
    branches:
      - "rtm-core-consolidation-*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rtm-core-ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  backend-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile changed backend surface
        run: |
          python -m compileall -q app.py billing.py ops_automation.py rtm_core tests

      - name: Import complete application graph
        run: |
          python -c "import app; print('RTM routes:', len(app.app.routes))"

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
